<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Trackr</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="app-mark" aria-hidden="true">✓</span>
        <div><h1>Todo Trackr</h1><p>Quick Capture</p></div>
      </header>

      <section aria-label="Server connection">
        <form id="connection-form">
          <label for="server-url">Server URL</label>
          <input id="server-url" type="url" placeholder="http://127.0.0.1:8888" required autocomplete="url" />
          <button class="primary" type="submit">Connect</button>
        </form>
        <p id="destination"></p>
      </section>

      <section id="signed-out" hidden>
        <p>This server requires a password.</p>
        <form id="login-form">
          <label for="password">Password</label>
          <input id="password" autocomplete="current-password" required type="password" />
          <button class="primary" type="submit">Sign in</button>
        </form>
      </section>

      <section id="signed-in" hidden>
        <p>
          Select text on a webpage, then press:
          <span class="shortcut-keys" aria-label="Command Shift E"><kbd>⌘</kbd><span>+</span><kbd>⇧</kbd><span>+</span><kbd>E</kbd></span>
        </p>
        <button class="primary" id="capture" type="button">Capture this page</button>
        <div class="secondary-actions">
          <button id="open-app" type="button">Open Todo Trackr</button>
          <button id="sign-out" type="button">Sign out</button>
        </div>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
