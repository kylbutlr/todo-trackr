name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check changed lines
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_REVISION...HEAD"
      - run: npm run check:migrations
      - run: npm run check:versions
      - run: bash -n scripts/build-macos-app.sh scripts/release-macos-update.sh scripts/install-macos.sh
      - run: npm run test:macos-install
      - run: npm test
      - run: npm run test:self-hosted
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm run build:server
